; [Ini] Set=: values in any INI file, [System.ini] Change= (test/run.sh INIFILES=1)
[Setup]
Title=INI test
Product=GDI INI test
DefaultDir=%BOOT%\TESTINI

[Files]
TESTDRV.SYS

[Ini]
Set=CONTROL.INI|MMCPL|kframe=%DIR%\KFRAME.CPL
Set=CONTROL.INI|drivers.desc|test.drv=Test driver
Set=A:\APP.INI|Options|Mode=2

[System.ini]
Change=386Enh|device=*vpicd|device=%DIR%\VPICDA.386
