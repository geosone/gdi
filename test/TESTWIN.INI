; test: SYSTEM.INI and a multi-config CONFIG.SYS
[Setup]
Title=TESTDRV Setup
Product=GeosOne TESTDRV 1.0
DefaultDir=%BOOT%\TESTDRV

[Options]
Option=on|Load TESTDRV.SYS in CONFIG.SYS
Option=on|Windows 3.x: install TESTVXD.386

[Files]
TESTDRV.SYS
2|TESTVXD.386

[Config.sys]
Remove=TESTDRV.SYS
Add=1|DEVICE=%DIR%\TESTDRV.SYS

[System.ini]
Remove=TESTVXD.386
Add=2|386Enh|device=%DIR%\TESTVXD.386
