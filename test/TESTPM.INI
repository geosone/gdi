; test: [Win.ini], [Ini], [ProgMan], [Registry], [Run] Windows= and replaced files in plain DOS
; (test/win3x.sh; %ACCESSORIES% is Zubeh\x94r in the German Windows)
[Setup]
Texts=English
Title=PM Test
Product=GeosOne GDI test
Version=1.0
DefaultDir=%BOOT%\PMTEST

[Options]
Option=on|Program Manager, WIN.INI, registry

[Files]
TESTTOOL.COM
README.TXT
PMTEST.CFG
REPL.TXT=%WINDIR%\REPL.TXT

[Run]
Windows=1|WRITE.EXE %DIR%\README.TXT

[Win.ini]
Set=1|GdiTest|Value=installed
Set=1|windows|Beep=no

[Ini]
Set=1|CONTROL.INI|GdiTest|Value=installed

[ProgMan]
Item=1|%ACCESSORIES%|GDI Test|%DIR%\TESTTOOL.COM|PROGMAN.EXE|1
Item=1|GDI Testgruppe|Editor Test|NOTEPAD.EXE %DIR%\README.TXT

[Registry]
Set=1|HKCR|.gdt|@|SZ|GdiTestFile
Import=1|PMTEST.REG
