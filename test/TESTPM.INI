; test: [Win.ini], [ProgMan], [Registry] and replaced files in plain DOS
; (test/win3x.sh; the group name is in code page 850: Zubeh\x94r)
[Setup]
Title=PM Test
Product=GeosOne GDI test
Version=1.0
DefaultDir=%BOOT%\PMTEST

[Options]
Option=on|Program Manager, WIN.INI, registry

[Files]
TESTTOOL.COM
README.TXT
PMTEST.CFG
REPL.TXT=%WINDIR%\REPL.TXT

[Win.ini]
Set=1|GdiTest|Value=installed
Set=1|windows|Beep=no

[ProgMan]
Item=1|Zubeh”r|GDI Test|%DIR%\TESTTOOL.COM|PROGMAN.EXE|1
Item=1|GDI Testgruppe|Editor Test|NOTEPAD.EXE %DIR%\README.TXT

[Registry]
Set=1|HKCR|.gdt|@|SZ|GdiTestFile
Import=1|PMTEST.REG
