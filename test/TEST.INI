; test setup for the GeosOne DOS Installer
[Setup]
Title=TESTDRV Setup
Product=GeosOne TESTDRV 1.0
License=LICENSE.TXT
Readme=README.TXT
DefaultDir=%BOOT%\TESTDRV

[Welcome]
TESTDRV is a test driver for the GeosOne DOS Installer.
This line is the second line of the welcome text.

[Options]
Option=on|Load TESTDRV.SYS in CONFIG.SYS
Option=off|Load it into upper memory|HIGH
Option=on|Use the /V switch| /V

[Files]
TESTDRV.SYS
TESTTOOL.COM
1|README.TXT

[Config.sys]
Remove=TESTDRV.SYS
Add=1|DEVICE%O2%=%DIR%\TESTDRV.SYS%O3%

[Autoexec.bat]
Remove=TESTTOOL
Add=1|%DIR%\TESTTOOL.COM
