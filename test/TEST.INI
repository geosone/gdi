; test setup for the GeosOne DOS Installer
[Setup]
Title=TESTDRV Setup
Product=GeosOne TESTDRV 1.0
License=1,2
License1=Primary test component|LICENSE.TXT
License2=Second test component|LICENSE2.TXT
Readme=README.TXT
DefaultDir=%BOOT%\TESTDRV

[Welcome]
TESTDRV is a test driver for the GeosOne DOS Installer.
This line is the second line of the welcome text.

[Options]
Option=on|Load TESTDRV.SYS in CONFIG.SYS
Option=off|Load it into upper memory|HIGH
Option=on|Use the /V switch| /V
Option=?PRESENT|Detection result: present
Option=?ABSENT|Detection result: absent

[Detect]
PRESENT=YES.COM
ABSENT=NO.COM

[Files]
TESTDRV.SYS
TESTTOOL.COM
1|README.TXT

[Config.sys]
Remove=TESTDRV.SYS
Add=1|DEVICE%O2%=%DIR%\TESTDRV.SYS%O3%
Add=4|REM DETECT PRESENT
Add=5|REM DETECT ABSENT

[Autoexec.bat]
Remove=TESTTOOL
Add=1|%DIR%\TESTTOOL.COM
