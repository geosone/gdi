; test setup for the GeosOne Dual Installer
[Setup]
Title=TESTDRV Setup
Product=GeosOne TESTDRV 1.0
License=1,2
License1=Primary test component|LICENSE.TXT
License2=Second test component|LICENSE2.TXT
Readme=README.TXT
DefaultDir=%BOOT%\TESTDRV

[Welcome]
TESTDRV is a test driver for the GeosOne Dual Installer.
This line is the second line of the welcome text.

; the texts of the package for the German installer texts (/L:German)
[Setup.German]
License1=Erste Testkomponente|LICENSE.TXT
Done=TESTDRV ist installiert.

[Welcome.German]
TESTDRV ist ein Testtreiber fÅr den GeosOne Dual Installer.

[Options.German]
Option=on|TESTDRV.SYS in der CONFIG.SYS laden
Option=off|In den oberen Speicher laden|HIGH
Option=on|Den Schalter /V verwenden| /V
Option=?PRESENT|Erkannt: vorhanden
Option=?ABSENT|Erkannt: nicht vorhanden

[Options]
Option=on|Load TESTDRV.SYS in CONFIG.SYS
Option=off|Load it into upper memory|HIGH
Option=on|Use the /V switch| /V
Option=?PRESENT|Detection result: present
Option=?ABSENT|Detection result: absent

[Detect]
PRESENT=YES.COM
ABSENT=NO.COM

[Files]
TESTDRV.SYS
TESTTOOL.COM
1|README.TXT

[Config.sys]
Remove=TESTDRV.SYS
Add=1|DEVICE%O2%=%DIR%\TESTDRV.SYS%O3%
Add=4|REM DETECT PRESENT
Add=5|REM DETECT ABSENT

[Autoexec.bat]
Remove=TESTTOOL
Add=1|%DIR%\TESTTOOL.COM
