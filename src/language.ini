; language.ini - the texts of the GeosOne Dual Installer in each language
; (UTF-8).  tools/mklang.py turns it into build/language.h at build time.
;
; [English] holds every text the installer uses; it is also the fallback
; for a missing text and for a country no section names.  Each further
; section names the systems it is for:
;   Country=   country codes: COUNTRY= of DOS (CONFIG.SYS), iCountry= in
;              [intl] of WIN.INI (49 Germany, 43 Austria, 41 Switzerland)
;   Language=  sLanguage= in [intl] of WIN.INI (deu, dea, des, ...)
; "\n" in a text is a new line, %s %d %c are filled in by the installer.
; [Text] in INSTALL.INI replaces a text for one package, [Setup] Texts=
; chooses the section.

